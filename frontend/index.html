<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f8f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111113" />
    <title>FreightParse</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong
      // theme. Mirrors the resolution order in src/hooks/useTheme.js; that hook
      // remains the source of truth once React mounts.
      ;(() => {
        try {
          const saved = localStorage.getItem('theme')
          const dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia?.('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
